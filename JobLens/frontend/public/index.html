${C('Gap Analysis','',`<select id="role-select" style="margin-bottom:14px">${Object.entries(GAP_REQ).map(([id])=>{const r=ROLES.find(x=>x.id===id)||{role:id};return`<option value="${id}">${r.role}</option>`}).join('')}</select><div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Skills You Have</div><div class="gskills" id="have-skills" style="margin-bottom:13px"></div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Skills to Learn</div><div class="gskills" id="need-skills" style="margin-bottom:14px"></div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px">Match Score</div><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden"><div id="match-bar" style="height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:4px;transition:width .8s var(--ease);width:0%"></div></div><div id="match-pct" style="font-family:var(--font-head);font-weight:800;font-size:25px;min-width:58px;text-align:right">0%</div></div>`)}
</div>
${C('Skill Radar','Your profile vs role',CV('gapRadarChart',340))}
</div>
${SL('All Role Match Cards')}<div class="g4" id="gap-role-cards"></div>
</div>`;}
function updateGapDisplay(rid){
  const{hv,nd,pct}=computeGap(rid);
  const h=document.getElementById('have-skills'),n=document.getElementById('need-skills'),b=document.getElementById('match-bar'),p=document.getElementById('match-pct');
  if(h)h.innerHTML=hv.map(s=>`<span class="gap-skill ghave">${s}</span>`).join('')||'<span style="font-size:11.5px;color:var(--text3)">None matched yet</span>';
  if(n)n.innerHTML=nd.map(s=>`<span class="gap-skill gneed">${s}</span>`).join('');
  if(b)b.style.width=pct+'%';
  if(p){p.textContent=pct+'%';p.style.color=pct>=70?'var(--green)':pct>=40?'var(--yellow)':'var(--red)';}
  const role=ROLES.find(r=>r.id===rid)||{};
  mkChart('gapRadarChart',{type:'radar',data:{labels:RADAR_D,datasets:[{label:'Your Profile',data:USER_R,borderColor:'#06d6a0',backgroundColor:'rgba(6,214,160,.12)',pointBackgroundColor:'#06d6a0',borderWidth:2},{label:role.role||rid,data:ROLE_R[rid]||[],borderColor:'#6c63ff',backgroundColor:'rgba(108,99,255,.1)',pointBackgroundColor:'#6c63ff',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:TXT,font:TICK,boxWidth:10,padding:10}}},scales:{r:{grid:{color:GRID},ticks:{display:false,backdropColor:'transparent'},pointLabels:{color:TXT,font:TICK},angleLines:{color:GRID}}}}});
  renderRoleMatchCards();
}
function renderMySkills(){const el=document.getElementById('my-skills');if(!el)return;el.innerHTML=userSkills.map(s=>`<span class="gap-skill ghave" data-remove="${s}" style="cursor:pointer">${s} <span style="opacity:.6">x</span></span>`).join('');}
function renderSkillPicker(){const el=document.getElementById('skill-picker');if(!el)return;el.innerHTML=ALL_PICKER.filter(s=>!userSkills.includes(s)).map(s=>`<span class="tag" style="background:var(--bg3);color:var(--text2);border:1px solid var(--border);font-size:11.5px;padding:4px 9px;cursor:pointer" data-add="${s}">${s}</span>`).join('');}
function renderRoleMatchCards(){const el=document.getElementById('gap-role-cards');if(!el)return;el.innerHTML=Object.entries(GAP_REQ).map(([id])=>{const{pct}=computeGap(id);const role=ROLES.find(r=>r.id===id)||{role:id};const col=pct>=70?'var(--green)':pct>=40?'var(--yellow)':'var(--red)';const left=GAP_REQ[id].length-Math.round(pct/100*GAP_REQ[id].length);return`<div class="card ani" style="cursor:pointer" onclick="document.getElementById('role-select').value='${id}';updateGapDisplay('${id}')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:12.5px;font-weight:500;color:var(--text)">${role.role}</span><span style="font-family:var(--font-head);font-weight:800;font-size:18px;color:${col}">${pct}%</span></div><div style="height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:8px"><div style="width:${pct}%;height:100%;background:${col};border-radius:2px"></div></div><div style="font-size:11.5px;color:var(--text3)">${left} skill${left!==1?'s':''} to learn</div></div>`;}).join('');}
function afterSkillGap(){
  renderMySkills();renderSkillPicker();updateGapDisplay('mle');
  document.getElementById('role-select').addEventListener('change',e=>updateGapDisplay(e.target.value));
  document.getElementById('my-skills').addEventListener('click',e=>{const s=e.target.closest('[data-remove]')?.dataset.remove;if(!s)return;userSkills=userSkills.filter(x=>x!==s);localStorage.setItem('jl-skills',JSON.stringify(userSkills));renderMySkills();renderSkillPicker();updateGapDisplay(document.getElementById('role-select').value);});
  document.getElementById('skill-picker').addEventListener('click',e=>{const s=e.target.closest('[data-add]')?.dataset.add;if(!s)return;userSkills=[...userSkills,s];localStorage.setItem('jl-skills',JSON.stringify(userSkills));renderMySkills();renderSkillPicker();updateGapDisplay(document.getElementById('role-select').value);});
}

/* INSIGHTS */
const INSIGHTS_DATA=[
  {emoji:"&#x1F525;",title:"Hottest Emerging Skill: 2025",hero:"RAG",body:"Retrieval-Augmented Generation now appears in 34% of AI Engineer postings, up from just 6% in 2023. Companies are hiring engineers who can build production-grade LLM pipelines.",tags:[{l:"AI/ML",c:"#6c63ff"},{l:"467% YoY",c:"#06d6a0"}]},
  {emoji:"&#x1F4A1;",title:"Career Path Spotlight",hero:"Data to AI",sm:true,body:"Data Analysts transitioning to AI roles see an average 48% salary increase. Bridge skills: LangChain, vector DBs, and prompt engineering.",tags:[{l:"Career Path",c:"#ffd166"},{l:"+48% salary",c:"#06d6a0"}]},
  {emoji:"&#x1F4C8;",title:"Role Explosion: AI Engineer",hero:"+142%",body:"AI Engineer represents 8.4% of all tech postings in 2025, barely existing in 2022. Companies want ML + software hybrid engineers.",tags:[{l:"142% YoY",c:"#ff6b6b"},{l:"8.4% of market",c:"#9d97ff"}]},
  {emoji:"&#x1F30F;",title:"Remote vs On-site Shift",hero:"38%",body:"Remote roles stabilized at 38% for tech in 2025. Hybrid (3 days office) is now dominant at 44%. Fully on-site growing for AI research roles.",tags:[{l:"Market Trend",c:"#6c63ff"},{l:"44% hybrid",c:"#45b7d1"}]},
  {emoji:"&#x26A1;",title:"Skill Depreciation Alert",hero:"Pivot Now",sm:true,body:"MATLAB, SAS, and standalone Tableau are declining. Companies want Python-native analytics with Polars, DuckDB, or dbt.",tags:[{l:"Declining",c:"#ff6b6b"},{l:"Mid-career risk",c:"#ffd166"}]},
  {emoji:"&#x1F4B0;",title:"Highest ROI Learning Path",hero:"+$31K",body:"For a Python developer, adding Kubernetes and AWS certifications yields the highest salary ROI - an average $31K annual increase.",tags:[{l:"+$31K avg lift",c:"#06d6a0"},{l:"Cloud",c:"#4ecdc4"}]},
];
function pageInsights(){
  return`${PH('AI','Insights','Intelligent analysis of job market signals and emerging trends')}
<div class="pc">
${SL('Market Intelligence')}<div class="g3">${INSIGHTS_DATA.map((ins,i)=>`<div class="insight-card ani d${(i%4)+1}"><div style="font-size:13px;font-weight:500;color:var(--text2);margin-bottom:5px">${ins.emoji} ${ins.title}</div><div class="ihero ${ins.sm?'sm':''}">${ins.hero}</div><div style="font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:11px">${ins.body}</div><div style="display:flex;flex-wrap:wrap;gap:6px">${ins.tags.map(t=>`<span class="tag" style="background:${t.c}18;color:${t.c};border:1px solid ${t.c}30">${t.l}</span>`).join('')}</div></div>`).join('')}</div>
${C('Technology Adoption Forecast','Actuals + 6-month projection',CV('forecastChart',260))}
${SL('Key Takeaways')}<div class="g3">${[{icon:'&#x1F393;',title:'For Students',pts:['Start with Python + SQL (80%+ of postings)','Add one cloud provider (AWS most demanded)','Build 2-3 real projects with real data','Learn Git/Docker early - baseline expectations']},{icon:'&#x1F504;',title:'For Career Switchers',pts:['Data Analyst to AI Engineer is the hottest path','LangChain + RAG bridge the gap','Expect 6-12 months of dedicated learning','Portfolio with LLM-powered apps stands out']},{icon:'&#x1F4C8;',title:'For Mid-Career Pros',pts:['Kubernetes + AWS adds $28K+ salary premium','MLOps is undersupplied - strong opportunity','Avoid over-investing in declining tools (SAS/MATLAB)','AWS SAA or GCP Pro certifications pay off']}].map(s=>`<div class="card ani"><div style="font-size:21px;margin-bottom:8px">${s.icon}</div><div style="font-weight:500;color:var(--text);margin-bottom:11px">${s.title}</div><ul style="list-style:none;display:flex;flex-direction:column;gap:8px">${s.pts.map(p=>`<li style="display:flex;gap:8px;font-size:12.5px;color:var(--text2);line-height:1.5"><span style="color:var(--accent);flex-shrink:0">&#x2192;</span>${p}</li>`).join('')}</ul></div>`).join('')}
</div>
</div>`;}
function afterInsights(){
  const lb=["Q1 24","Q2 24","Q3 24","Q4 24","Q1 25","Q2 25","Q3 25","Q4 25"];
  const sr=[{n:"LLM Tools",c:"#ff6b6b",d:[8,14,20,28,32,38,45,52],a:4},{n:"Cloud Native",c:"#06d6a0",d:[42,44,47,50,55,58,61,65],a:4},{n:"Vector DB",c:"#ffd166",d:[2,4,8,14,18,25,33,42],a:4},{n:"Traditional BI",c:"#9699b0",d:[68,65,61,57,53,50,47,44],a:4}];
  const ds=[];
  sr.forEach(s=>{ds.push({label:s.n,data:s.d.slice(0,s.a+1).concat(Array(lb.length-s.a-1).fill(null)),borderColor:s.c,fill:false,tension:.4,pointRadius:3,borderWidth:2});ds.push({label:s.n+' (forecast)',data:Array(s.a).fill(null).concat(s.d.slice(s.a)),borderColor:s.c,borderDash:[6,4],fill:false,tension:.4,pointRadius:3,borderWidth:2});});
  mkChart('forecastChart',{type:'line',data:{labels:lb,datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:TXT,font:TICK,boxWidth:10,padding:10,filter:i=>!i.text.includes('forecast')}}},scales:{x:{grid:{color:GRID},ticks:{color:TXT,font:TICK}},y:{grid:{color:GRID},ticks:{color:TXT,font:TICK,callback:v=>v+'%'}}}}});
}

/* ROUTER */
const PAGES={dashboard:{r:pageDashboard,a:afterDashboard},skills:{r:pageSkills,a:afterSkills},roles:{r:pageRoles,a:afterRoles},salary:{r:pageSalary,a:afterSalary},geo:{r:pageGeo,a:afterGeo},gap:{r:pageSkillGap,a:afterSkillGap},insights:{r:pageInsights,a:afterInsights}};
function navigate(pageId){
  if(!PAGES[pageId])return;currentPage=pageId;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===pageId));
  const main=document.getElementById('main');main.innerHTML=PAGES[pageId].r();
  requestAnimationFrame(()=>PAGES[pageId].a());
  main.addEventListener('click',e=>{const pg=e.target.closest('[data-pg]')?.dataset.pg;if(pg&&PAGES[pg])navigate(pg);});
}
document.getElementById('sidebar').addEventListener('click',e=>{
  const pg=e.target.closest('[data-page]')?.dataset.page;if(pg)navigate(pg);
  if(e.target.closest('#themeBtn')){theme=theme==='dark'?'light':'dark';localStorage.setItem('jl-theme',theme);document.documentElement.setAttribute('data-theme',theme==='light'?'light':'dark');document.getElementById('themeBtn').innerHTML=theme==='dark'?'&#9728; Light mode':'&#9790; Dark mode';}
});
navigate('dashboard');
</script>
